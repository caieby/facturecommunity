name: Uptime Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Facture Community
        id: main_site
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://facturecommunity.org/ || echo "000")
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Check FactureHub
        id: hub
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://facturecommunity.org/social/ || echo "000")
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Check Nexus bot heartbeat
        id: nexus
        run: |
          heartbeat=$(curl -s "https://vrhfajwulxjfmgzyzaxx.supabase.co/rest/v1/bot_status?id=eq.nexus&select=last_heartbeat" \
            -H "apikey: sb_publishable_37fQXfSzDzUrv35A5VSFXA_eqZBc3dB" | jq -r '.[0].last_heartbeat // empty')
          echo "heartbeat=$heartbeat" >> "$GITHUB_OUTPUT"

      - name: Log results to Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXUS_HEARTBEAT: ${{ steps.nexus.outputs.heartbeat }}
        run: |
          main_up=$([ "${{ steps.main_site.outputs.status }}" = "200" ] && echo true || echo false)
          hub_up=$([ "${{ steps.hub.outputs.status }}" = "200" ] && echo true || echo false)

          # Nexus has no HTTP endpoint to ping -- it's "up" if its own
          # heartbeat (bot_status.last_heartbeat, written by the bot's own
          # process) is recent. More than 3 minutes stale counts as down.
          nexus_up=false
          if [ -n "$NEXUS_HEARTBEAT" ]; then
            heartbeat_epoch=$(date -d "$NEXUS_HEARTBEAT" +%s 2>/dev/null || echo 0)
            now_epoch=$(date +%s)
            if [ $((now_epoch - heartbeat_epoch)) -lt 180 ]; then
              nexus_up=true
            fi
          fi

          curl -s -X POST "https://vrhfajwulxjfmgzyzaxx.supabase.co/rest/v1/uptime_checks" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "[{\"service\":\"facturecommunity\",\"is_up\":$main_up},{\"service\":\"facturehub\",\"is_up\":$hub_up},{\"service\":\"nexus\",\"is_up\":$nexus_up}]"
