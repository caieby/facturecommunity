<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post | FactureHub</title>
  <link rel="icon" type="image/png" href="/assets/Facture_Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>try{if(localStorage.getItem('facture-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="no-banner">
  <div class="age-gate" id="ageGate" hidden>
    <div class="age-gate-card">
      <p class="age-gate-text">Let&rsquo;s make sure you are human.</p>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEmh6xhRr9ApRWq6" data-callback="onTurnstileSuccess" data-theme="dark"></div>
    </div>
  </div>

  <header class="topbar">
    <a href="/index.html" class="brand">
      <img src="/assets/Facture_Logo.png" alt="Facture logo" class="brand-logo">
      <span class="brand-name">Facture</span>
    </a>
    <nav class="menu">
      <a class="menu-toggle" href="/social/home.html">&larr; Back to Home</a>
    </nav>
  </header>

  <div class="page-loading" id="pageLoading">
    <div class="loading-spinner"></div>
  </div>

  <main class="info-page" id="postView" hidden>
    <h1 class="page-title">Post</h1>
    <div class="feed-list" id="postContainer"></div>
  </main>

  <main class="page" id="postNotFound" hidden>
    <h1 class="page-title">Post Not Found</h1>
    <p class="page-hint">This post doesn&rsquo;t exist, was deleted, or you don&rsquo;t have permission to view it.</p>
    <a class="action-button page-button" href="/social/feed.html">Back to Feed</a>
  </main>

  <footer class="site-footer">
    <p>&copy; Facture 2023-Present all rights reserved.</p>
    <p><a href="/social/tos.html" class="inline-link">TOS</a></p>
  </footer>

  <script src="/script.js"></script>
  <script src="/social/posts.js"></script>
  <script src="/social/posts/view.js"></script>
</body>
</html>
